name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate JSON and check JS syntax
        run: npm test

      - name: web-ext lint
        run: npm run lint

      - name: Build zip
        run: npm run build

  safari:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: List schemes
        run: xcodebuild -list -project safari/PureFocus/PureFocus.xcodeproj

      - name: Build macOS app (ad-hoc signed)
        run: tools/build-safari.sh --build

      - name: Build iOS app for simulator (unsigned)
        run: tools/build-safari.sh --build-ios
